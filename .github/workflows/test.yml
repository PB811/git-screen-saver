name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y gnome-terminal libglib2.0-bin

      - name: Run test suite
        run: bash tests/run_all.sh
